spring:
  application:
    name: divergia-backend
  threads:
    virtual:
      enabled: true
  profiles:
    active: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/divergia}
    username: ${DB_USERNAME:divergia}
    password: ${DB_PASSWORD:divergia}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

divergia:
  llm:
    base-url: ${ABACUS_BASE_URL:https://routellm.abacus.ai/v1}
    api-key: ${ABACUS_API_KEY:}
    model-name: ${ABACUS_MODEL_NAME:claude-sonnet-5}
  embedding:
    base-url: ${GEMINI_BASE_URL:}
    api-key: ${GOOGLE_API_KEY:}
    model-name: ${GEMINI_MODEL_NAME:gemini-embedding-001}
    output-dimensionality: 768

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

---
spring:
  config:
    activate:
      on-profile: dev
management:
  endpoint:
    health:
      show-details: always

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/divergia_test}
    username: ${DB_USERNAME:divergia}
    password: ${DB_PASSWORD:divergia}
management:
  endpoint:
    health:
      show-details: always

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
management:
  endpoint:
    health:
      show-details: never
