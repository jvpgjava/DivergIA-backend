spring:
  application:
    name: divergia-backend
  threads:
    virtual:
      enabled: true
  profiles:
    active: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/divergia}
    username: ${DB_USERNAME:divergia}
    password: ${DB_PASSWORD:divergia}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME:}
    password: ${GMAIL_APP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

divergia:
  llm:
    base-url: ${ABACUS_BASE_URL:https://routellm.abacus.ai/v1}
    api-key: ${ABACUS_API_KEY:}
    model-name: ${ABACUS_MODEL_NAME:claude-sonnet-5}
  embedding:
    base-url: ${GEMINI_BASE_URL:}
    api-key: ${GOOGLE_API_KEY:}
    model-name: ${GEMINI_MODEL_NAME:gemini-embedding-001}
    output-dimensionality: 768
  jwt:
    secret: ${JWT_SECRET:dev-only-insecure-jwt-secret-nao-usar-em-producao-32bytes}
    expiracao-minutos: ${JWT_EXPIRACAO_MINUTOS:15}
  recuperacao-senha:
    validade-minutos: 30
  rate-limit:
    auth:
      capacidade: 5
      janela-minutos: 1
  extracao:
    base-url: ${EXTRACAO_BASE_URL:http://localhost:8000}
    timeout-segundos: ${EXTRACAO_TIMEOUT_SEGUNDOS:30}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    mail:
      enabled: false

---
spring:
  config:
    activate:
      on-profile: dev
management:
  endpoint:
    health:
      show-details: always

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/divergia_test}
    username: ${DB_USERNAME:divergia}
    password: ${DB_PASSWORD:divergia}

divergia:
  rate-limit:
    auth:
      # bem mais alto que o default (5/min) para não interferir em testes que
      # chamam /login ou /cadastro várias vezes; o rate limit em si é
      # validado em um teste dedicado que sobrescreve esse valor.
      capacidade: 1000

management:
  endpoint:
    health:
      show-details: always

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  mail:
    username: ${GMAIL_USERNAME}
    password: ${GMAIL_APP_PASSWORD}

divergia:
  jwt:
    secret: ${JWT_SECRET}

management:
  endpoint:
    health:
      show-details: never
