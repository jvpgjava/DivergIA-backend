server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: divergia-backend
  threads:
    virtual:
      enabled: true
  profiles:
    active: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/divergia}
    username: ${DB_USERNAME:divergia}
    password: ${DB_PASSWORD:divergia}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME:}
    password: ${GMAIL_APP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

divergia:
  llm:
    base-url: ${ABACUS_BASE_URL:https://routellm.abacus.ai/v1}
    api-key: ${ABACUS_API_KEY:}
    model-name: ${ABACUS_MODEL_NAME:claude-sonnet-5}
  embedding:
    base-url: ${GEMINI_BASE_URL:}
    api-key: ${GOOGLE_API_KEY:}
    model-name: ${GEMINI_MODEL_NAME:gemini-embedding-001}
    output-dimensionality: 768
  jwt:
    secret: ${JWT_SECRET:dev-only-insecure-jwt-secret-nao-usar-em-producao-32bytes}
    expiracao-minutos: ${JWT_EXPIRACAO_MINUTOS:15}
  recuperacao-senha:
    validade-minutos: 30
  rate-limit:
    auth:
      capacidade: 5
      janela-minutos: 1
    analise:
      capacidade: 10
      janela-minutos: 1
  analise:
    quantidade-exemplos-rag: 5
  extracao:
    base-url: ${EXTRACAO_BASE_URL:http://localhost:8000}
    timeout-segundos: ${EXTRACAO_TIMEOUT_SEGUNDOS:30}
  promocao-rag:
    # todo dia às 3h da manhã, por padrão
    cron: ${PROMOCAO_RAG_CRON:0 0 3 * * *}
  uploads:
    diretorio: ${UPLOADS_DIR:./uploads}
    base-url: ${UPLOADS_BASE_URL:http://localhost:8080/uploads}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    mail:
      enabled: false
