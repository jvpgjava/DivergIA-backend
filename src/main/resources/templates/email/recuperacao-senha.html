<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Sem isso, alguns clientes (Gmail incluso) reprocessam as cores do
       e-mail no modo escuro do aparelho — o que já causou artefatos
       visuais estranhos (faixa de topo pela metade, fundo escuro atrás só
       da logo). Força o e-mail a sempre renderizar exatamente como
       desenhado, nos dois temas. -->
  <meta name="color-scheme" content="light" />
  <meta name="supported-color-schemes" content="light" />
  <title>Recuperação de senha — DivergIA</title>
</head>
<body style="margin:0;padding:0;background-color:#EEF2F6;font-family:Arial, Helvetica, sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#EEF2F6;padding:40px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background-color:#FFFFFF;border-radius:20px;overflow:hidden;box-shadow:0 2px 12px rgba(13,24,42,0.06);">
          <tr>
            <td align="center" bgcolor="#0D182A" style="background-color:#0D182A;padding:32px 32px 28px 32px;">
              <img th:src="'cid:' + ${logoContentId}" alt="DivergIA" width="150" style="display:block;width:150px;max-width:150px;height:auto;border:0;" />
            </td>
          </tr>
          <tr>
            <td style="padding:28px 36px 4px 36px;">
              <p style="margin:0;font-size:19px;font-weight:bold;color:#0D182A;text-align:center;">Recuperação de senha</p>
            </td>
          </tr>
          <tr>
            <td style="padding:0 36px 20px 36px;">
              <p style="margin:0;font-size:14px;line-height:1.6;color:#64748B;text-align:center;">
                Use o código abaixo para redefinir sua senha. Ele expira em
                <strong style="color:#0D182A;"><span th:text="${validadeMinutos}">30</span> minutos</strong>.
              </p>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:4px 24px 32px 24px;text-align:center;white-space:nowrap;">
              <span th:text="${token}" style="font-family:'Courier New', Courier, monospace;font-size:26px;font-weight:bold;color:#26C6FF;white-space:nowrap;">0 0 0 0 0 0</span>
            </td>
          </tr>
          <tr>
            <td style="padding:0 36px 8px 36px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="border-top:1px solid #E2E8F0;padding-top:20px;">
                    <p style="margin:0;font-size:12.5px;line-height:1.6;color:#94A3B8;text-align:center;">
                      Se você não solicitou essa recuperação, pode ignorar este e-mail com segurança — sua senha continua a mesma.
                    </p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:20px 36px 32px 36px;">
              <p style="margin:0;font-size:11.5px;color:#B4C0CE;text-align:center;">divergIA — identificador de contextos de IA</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
