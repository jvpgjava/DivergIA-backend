spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/divergia_test}
    username: ${DB_USERNAME:divergia}
    password: ${DB_PASSWORD:divergia}
    hikari:
      # cada configuração distinta de @SpringBootTest cria um contexto (e um
      # pool) próprio no cache do Spring; com vários contextos na suíte, o
      # default de 10 conexões por pool estoura o max_connections do Postgres.
      maximum-pool-size: 3
      minimum-idle: 1

divergia:
  rate-limit:
    # bem mais alto que o default para não interferir em testes que chamam
    # /login, /cadastro ou /analises várias vezes; o rate limit em si é
    # validado em testes dedicados que sobrescrevem esses valores.
    auth:
      capacidade: 1000
    analise:
      capacidade: 1000

management:
  endpoint:
    health:
      show-details: always
