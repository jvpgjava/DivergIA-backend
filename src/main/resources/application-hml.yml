# Homologação — roda na VPS (ver docs/DEPLOY.md). Sem defaults: falta
# qualquer uma dessas variáveis de ambiente e a aplicação nem sobe.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  mail:
    username: ${GMAIL_USERNAME}
    password: ${GMAIL_APP_PASSWORD}

divergia:
  jwt:
    secret: ${JWT_SECRET}

management:
  endpoint:
    health:
      show-details: always
